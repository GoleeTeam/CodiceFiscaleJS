name: Build

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  publish:
    name: Publish
    runs-on: ubuntu-22.04
    needs: build

    permissions:
      id-token: write
      contents: read

    if: github.ref == 'refs/heads/master' && !contains(github.event.head_commit.message, '[skip-publish]')  

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: "Setup: Node"
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Rename and version for Golee
        run: |
          UPSTREAM_VERSION=$(node -p "require('./package.json').version")
          npm pkg set name=@golee/codice-fiscale-js
          npm pkg set repository.url=git+https://github.com/GoleeTeam/CodiceFiscaleJS.git
          npm version "${UPSTREAM_VERSION}-golee.${{ github.run_number }}" --no-git-tag-version

      - name: Publish
        run: npm publish --access public --tag latest
